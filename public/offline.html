<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZ's BCS Bank — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #070614;
        color: #f8f7ff;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        padding: 32px;
        border-radius: 28px;
        background: rgba(24, 18, 56, 0.85);
        border: 1px solid rgba(251, 191, 36, 0.35);
      }
      h1 { margin: 0 0 8px; font-size: 1.5rem; color: #fde68a; }
      p { margin: 0 0 20px; color: #cbd5e1; font-size: 0.92rem; }
      button {
        border: 0;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #f59e0b, #7c3aed);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>OZ's BCS Bank</h1>
      <p>You appear to be offline. Reconnect and refresh to load the latest BCS archive.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
