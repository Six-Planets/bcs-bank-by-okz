<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>OZ's BCS Bank — Royal Topic Master &amp; BCS Question Intelligence</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23F59E0B'/%3E%3Cstop offset='50%25' stop-color='%237C3AED'/%3E%3Cstop offset='100%25' stop-color='%230EA5E9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='36' height='36' rx='11' fill='url(%23g)'/%3E%3Cpath d='M9 23L11.5 13L18 18L24.5 13L27 23H9Z' fill='%23FFF7ED'/%3E%3Ccircle cx='18' cy='10.5' r='2.2' fill='%23FDE047'/%3E%3C/svg%3E"
    />

    <!-- Apply theme + backdrop mode BEFORE first paint: zero flash -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('bbbokz-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        root.setAttribute('data-theme', theme);
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme;
        try {
          var lowCpu = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
          var lowMem = navigator.deviceMemory && navigator.deviceMemory <= 4;
          if (lowCpu || lowMem) root.setAttribute('data-perf', 'lite');
        } catch (e) {}
      })();
    </script>
    <style>
      html { background-color: #F4F1FF; }
      html[data-theme='dark'] { background-color: #070614; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body class="antialiased selection:bg-amber-300/40 selection:text-indigo-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
